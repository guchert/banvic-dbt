
sources:
  - name: erp
    description: Esse é o sistema ERP da Banvic com dados de clientes, colaboradores, contas e transações.
    database: dev
    schema: erp_banvic
    tables:
      - name: localidades
        description: Tabela fonte de localidades com informações de cidade e estado.
      - name: clientes
        description: Tabela fonte de clientes com informações pessoais de cada cliente da Banvic.
      - name: colaboradores
        description: Tabela fonte de colaboradores com informações pessoais de cada colaborador da Banvic.
      - name: agencias
        description: Tabela fonte de agências com nome, endereço, tipo e data de abertura.
      - name: contas
        description: Tabela fonte de contas com número da conta, cliente titular, agência, colaborador responsável, tipo de conta, saldos e datas de abertura e de último lançamento.
      - name: transacoes
        description: Tabela fonte de transações com código, conta, data, tipo e valor de cada transação realizada.